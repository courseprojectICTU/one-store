name = "one-store"
main = "backend/src/index.ts"
compatibility_date = "2025-01-15"

[ai]
binding = "AI"
remote = true

[assets]
directory = "./frontend/out"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "fashion_db"
database_id = "b19134d6-73da-4049-a70f-f3d0dd24638f"
migrations_dir = "backend/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "6a3663c4632b4c5296f278777d72753e"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "one-store-images"

[[vectorize]]
binding = "VECTORIZE"
index_name = "ba-khi-knowledge"
remote = true
